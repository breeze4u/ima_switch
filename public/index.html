<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ima-switch · 腾讯 IMA 账号切换</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div>
        <h1>ima-switch</h1>
        <p class="sub">腾讯 IMA 电脑端账号切换与备份</p>
      </div>
      <div class="status" id="status">
        <span class="dot" id="runDot"></span>
        <span id="runText">检测中…</span>
      </div>
    </header>

    <section class="meta" id="meta">
      <div><span class="label">User Data</span><code id="imaPath">-</code></div>
      <div><span class="label">账号库</span><code id="vaultPath">-</code></div>
    </section>

    <section class="toolbar">
      <button class="btn primary" id="btnSave">保存当前账号</button>
      <button class="btn" id="btnRefresh">刷新</button>
      <button class="btn" id="btnImport">导入备份</button>
      <input type="file" id="fileInput" accept=".zip,.enc" hidden />
    </section>

    <section class="list-wrap">
      <h2>账号档案</h2>
      <div id="accounts" class="accounts"></div>
      <p class="empty" id="empty" hidden>还没有账号。先在 IMA 登录，然后点「保存当前账号」。</p>
    </section>

    <footer class="foot">
      <span>仅监听 127.0.0.1 · 登态含敏感信息，请勿分享导出包</span>
    </footer>
  </div>

  <dialog id="dlgSave">
    <form method="dialog" id="saveForm">
      <h3>保存当前登录为账号</h3>
      <label>名称 <input name="name" required maxlength="64" placeholder="例如：工作号" /></label>
      <label>备注 <input name="note" maxlength="200" placeholder="可选" /></label>
      <div class="actions">
        <button value="cancel" class="btn">取消</button>
        <button value="ok" class="btn primary">保存</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlgSwitch">
    <form method="dialog" id="switchForm">
      <h3>切换账号</h3>
      <p id="switchMsg"></p>
      <label class="check"><input type="checkbox" name="launch" checked /> 切换后启动 IMA</label>
      <div class="actions">
        <button value="cancel" class="btn">取消</button>
        <button value="ok" class="btn primary">确认切换</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlgExport">
    <form method="dialog" id="exportForm">
      <h3>导出账号</h3>
      <p id="exportMsg"></p>
      <label>密码（可选，填写后 AES 加密） <input name="password" type="password" autocomplete="new-password" /></label>
      <div class="actions">
        <button value="cancel" class="btn">取消</button>
        <button value="ok" class="btn primary">导出</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlgImport">
    <form method="dialog" id="importForm">
      <h3>导入备份</h3>
      <p id="importFileLabel">未选择文件</p>
      <label>密码（加密包需要） <input name="password" type="password" autocomplete="new-password" /></label>
      <label>显示名称（可选） <input name="name" maxlength="64" /></label>
      <div class="actions">
        <button value="cancel" class="btn">取消</button>
        <button value="ok" class="btn primary">导入</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
